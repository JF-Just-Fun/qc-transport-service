name: Build and Deploy Docker Image

on:
  push:
    branches:
      - main
      - test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1

      - name: Set branch name to environment variable
        run: echo "BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t qc-transport-service:latest .
          docker save qc-transport-service:latest -o qc-transport-service

      - name: copy docker image into server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          source: "./qc-transport-service"
          target: ${{ secrets.SERVER_DOCKER_IMAGES_PATH }}

      - name: executing remote ssh commands to load docker image
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT }}
          script: |
            docker rm $(docker ps -a --filter "ancestor=qc-transport-service" -q)
            images=$(docker images -a | grep qc-transport-servic | awk '{print $3}') && \
            if [ -n "$images" ]; then \
              echo $images | xargs docker rmi -f; \
            else \
              echo "No images found for qc-transport-service"; \
            fi

            cd ${{ secrets.SERVER_DOCKER_IMAGES_PATH }}
            docker load -i qc-transport-service
            docker stop qc-transport-service-container
            docker run -p 5555:5555 --name qc-transport-service-container qc-transport-service
